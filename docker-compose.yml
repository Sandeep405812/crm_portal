version: '3.8'

services:
  # MySQL Database
  mysqldb:
    image: mysql:8.0
    container_name: mini_erp_mysql
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: mini_erp_db
    ports:
      - "3306:3306"
    volumes:
      - dbdata:/var/lib/mysql

  # Express Backend API
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: mini_erp_backend
    restart: always
    ports:
      - "5000:5000"
    environment:
      PORT: 5000
      DATABASE_URL: "mysql://root:rootpassword@mysqldb:3306/mini_erp_db"
      JWT_SECRET: "mini_erp_jwt_secret_key_super_secure_2026"
      JWT_EXPIRES_IN: "7d"
      NODE_ENV: "production"
    depends_on:
      - mysqldb

  # React Frontend (Vite)
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: mini_erp_frontend
    restart: always
    ports:
      - "3000:80"
    depends_on:
      - backend

volumes:
  dbdata:
